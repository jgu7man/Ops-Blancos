<g-topbar [menuRoutes]="routes"></g-topbar>

<mat-drawer-container>
  <!-- ADMIN SIDEBAR -->
  <mat-drawer
    [opened]="responsive.large"
    mode="side"
    id="admin-sidebar"
    mxStretchHeight
  >
    <ng-container *ngFor="let view of dashboard.views">
      <a
        class="side navbtn"
        [routerLink]="[view.route]"
        [routerLinkActive]="'active'"
        [ngClass]="{ active: alikeActive.isActive }"
        [queryParams]="view.queryParams"
      >
        <i class="fas {{ view.icon }} fa-lg  white-text"></i> {{view.display}}
      </a>
      <mat-divider [inset]="true"></mat-divider>
      <a
        routerLink="{{ view.alike }}"
        routerLinkActive
        #alikeActive="routerLinkActive"
        hidden="true"
      ></a>
    </ng-container>
  </mat-drawer>

  <!-- ADMIN DASHBOARD -->
  <mat-drawer-content>
    <div class="page-container">
      <div class="row">
        <div class="col s12">
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>
  </mat-drawer-content>
</mat-drawer-container>

<!-- MOBILE BOTTOM BAR -->
<ng-container *ngIf="!responsive.large">
  <mat-toolbar color="accent" class="mat-elevation-z4" id="bottom-bar">
    <ng-container *ngFor="let view of dashboard.views">
      <span class="navbtn">
        <i
          class="fas {{ view.icon }} fa-lg white-text"
          [routerLink]="[view.route]"
          [queryParams]="view.queryParams"
          [routerLinkActive]="'active'"
          [ngClass]="{ active: alikeActive.isActive }"
        ></i>
      </span>
      <a
        routerLink="{{ view.alike }}"
        routerLinkActive
        #alikeActive="routerLinkActive"
        hidden="true"
      ></a>
    </ng-container>
  </mat-toolbar>
</ng-container>
