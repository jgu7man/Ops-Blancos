<div class="container page-container">
  <div class="row">
    <div class="col s12 center">
      <h2 class="center white-text">¿Listo para empacar?</h2>
      <p class="center white-text">Escanea cada una de las prendas para asignarlas como empacadas y listas para trabajar</p>
    </div>
  </div>
  <div class="row" id="card-container">
    <div class="col s12">
      <g-scanner [title]="false"></g-scanner>
    </div>
  </div>


  <div class="row">
    <div class="col s6" *ngFor="let prenda of prop?.prendas">
      <mat-card>
        <mat-card-content>
        <div class="row">
          <!-- Scanned notification -->
          <div class="col s3">
            <span *ngIf="scanned(prenda) !== undefined"
            matBadge="{{badge(prenda)}}"
            [matBadgeColor]="colorBadge(prenda)"
            ></span>
            <p [ngSwitch]="prenda.producto">
              <span *ngSwitchCase="'Toalla de Cuerpo'" >
                <i class="prenda-icon flaticon-towel"></i>
              </span>
              <span *ngSwitchCase="'Toalla de Mano'" >
                <i class="prenda-icon flaticon-towel"></i>
              </span>
              <span *ngSwitchCase="'Funda Almohada'" >
                <i class="prenda-icon flaticon-pillow"></i>
              </span>
              <span *ngSwitchCase="'Plana Individual'" >

              </span>
              <span *ngSwitchCase="'Cajonera Individual'" >

              </span>
              <span *ngSwitchCase="'Plana Matrimonial'" >

              </span>
              <span *ngSwitchCase="'Cajonera Matrimonial'" >

              </span>
              <span *ngSwitchCase="'Plana Queen Size'" >

              </span>
              <span *ngSwitchCase="'Cajonera Queen Size'" >

              </span>
              <span *ngSwitchCase="'Plana King Size'" >

              </span>
              <span *ngSwitchCase="'Cajonera King Size'" >

              </span>
              <span *ngSwitchDefault>  </span>
            </p>
          </div>

          <!-- Item Info -->
          <div class="col s7">
            <p style="margin-bottom: 0;">{{prenda.producto}}</p>
          </div>
          <div class="col s2">
            {{prenda.index}}
          </div>

        </div>

      </mat-card-content>
    </mat-card>

    </div>

  </div>

  <div class="row">
    <div class="col s12 center">
      <button mat-raised-button color='accent' class="white-text"
      (click)="onFinish()">
        Terminar
      </button>
    </div>
  </div>
</div>
