<form [formGroup]="reportes_.reporteForm">

  <!-- Normal -->
  <ng-template #normal>
    <p class="center">
      ¿Qué problema hay con esta prenda?
    </p>

    <mat-selection-list #problemasPanel
    (selectionChange)="onSelecteIssue($event)"
    [multiple]="false">
      <mat-list-option
      *ngFor="let item of reportes_.limpiezaIssues"
      [value]="item"
      >
        {{item}}
      </mat-list-option>
    </mat-selection-list>

    <div class="row">
      <div class="col s12 center">
        <button mat-raised-button color="accent"
        (click)="reportes_.stateCtrl.setValue('damage')"
        >
          Reportar otro problema
        </button>

      </div>
    </div>
  </ng-template>


  <!-- Reporte form -->
  <div *ngIf="reportes_.stateCtrl.value != 'sucio'; else normal">

    <!-- Reporte de estado -->
    <div class="row">
      <div class="col s12">

        <p class="center note">
          Indica cuál es problema con la prenda
        </p>

        <mat-form-field appearance="outline">
          <mat-label>Reporte</mat-label>
          <textarea
          matInput
          type="text"
          name="reporte"
          [formControl]="reportes_.reporteCtrl"
          ></textarea>
          <mat-error *ngIf="reportes_.reporteCtrl.hasError('required')">
            Es necesario que describas el estado de la prenda
          </mat-error>
        </mat-form-field>

      </div>
    </div>




    <!-- Volver -->
    <div class="row">
      <div class="col s12 center">
        <button mat-raised-button
        (click)="reportes_.stateCtrl.setValue('sucio')"
        >Sugerencias</button>
      </div>
    </div>

  </div>

  <!-- Evidencia -->
  <div class="row">
    <div class="col s12">
      <div class="center">
        <p class="center note">Toma una evidencia del daño de la prenda</p>
        <button mat-raised-button color="primary"
        (click)="onTakeEvidence()">
          <i class="fas fa-camera fa-lg white-text"></i>
        </button>
      </div>
    </div>
  </div>



</form>
