
<mat-dialog-content>
  <div class="row">
    <div class="col s12">
      <p>
        <b class="cyan-text"> {{data.producto}} </b>
        Paquete: {{data.paquete}}, pieza: {{data.unidad}}/{{data.total}}
      </p>

    </div>
  </div>
  <g-limpieza-reporte-form (validForm)="validateReady($event)"></g-limpieza-reporte-form>
</mat-dialog-content>

<mat-dialog-actions
style="display: flex; justify-content: space-around;">
    <button
    mat-raised-button
    (click)="dialog_.close()">
      Cancelar
    </button>

    <button
    mat-raised-button
    color="primary"
    [disabled]="!isReady"
    (click)="onReport()"
    >
      <b>REPORTAR</b>
    </button>
</mat-dialog-actions>
