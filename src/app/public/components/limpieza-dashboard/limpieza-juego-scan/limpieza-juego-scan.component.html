<div class="container">
  <div class="row">
    <div class="col s12 center">
      <h2 class="center white-text">¡Listo!</h2>
      <p class="center white-text">Escanea cada una de las prendas para verficarlas</p>
    </div>
  </div>
  <div class="row" id="card-container">
    <div class="col s12">
      <g-scanner [title]="false"></g-scanner>
    </div>
  </div>


  <div class="row">
    <div class="col s3" *ngFor="let prenda of prop?.prendas">
      <mat-card>
        <span *ngIf="scanned(prenda) !== undefined"
        matBadge="{{badge(prenda)}}"
        [matBadgeColor]="colorBadge(prenda)"
        ></span>
        <mat-card-content>
          <i class="prenda-icon flaticon-towel"></i> {{prenda.index}}
        </mat-card-content>
      </mat-card>
    </div>
    <div class="col s3" >
      <mat-card>
        <span matBadge="&#10004;"></span>
        <mat-card-content class="center">
          <i class="prenda-icon flaticon-hand-towel"></i> 2
        </mat-card-content>
      </mat-card>
    </div>
    <div class="col s3" >
      <mat-card>
        <mat-card-content>
          <i class="prenda-icon flaticon-bed-sheet"></i> 3
        </mat-card-content>
      </mat-card>
    </div>
    <div class="col s3" >
      <mat-card>
        <mat-card-content>
          <i class="prenda-icon flaticon-pillow"></i> 4
        </mat-card-content>
      </mat-card>
    </div>
    <div class="col s3" >
      <mat-card>
        <mat-card-content>
          <i class="prenda-icon flaticon-wipe"></i> 5
        </mat-card-content>
      </mat-card>
    </div>
    <div class="col s3" >
      <mat-card>
        <mat-card-content>
          <i class="prenda-icon flaticon-towel"></i> 6
        </mat-card-content>
      </mat-card>
    </div>
  </div>

  <div class="row">
    <div class="col s12 center">
      <button mat-raised-button color='accent' class="white-text"
      (click)="onFinish()">
        Terminar
      </button>
    </div>
  </div>
</div>
