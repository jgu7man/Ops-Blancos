<div class="container" id="work-area">
  <div class="row" id="card-container">

    <!-- ACTIONS COL -->
    <div class="col s12 l8">
      <div class="row">

        <!-- INFO COL -->
        <div class="col s12 m6 info-col" >
          <span class="white-text">Paquete:</span>
          <h2 class="white-text" >
            {{propCurrentState?.direccion}} - {{propCurrentState?.pid}}
          </h2>
          <button mat-raised-button color='accent' class="white-text"
          (click)="onFinish()">
            Terminar
          </button>
        </div>

        <!-- SCANNER COL -->
        <div class="col s12 m6 center">
          <p class="white-text">Escanea cada una de las prendas para verficarlas</p>
          <g-scanner [title]="false"></g-scanner>
        </div>
      </div>
    </div> <!-- ENDS ACTIONS COL -->

    <!-- NOTIFY COL -->
    <div class="col s12">
      <div class="row">

        <!-- ITEM AREA -->
        <ng-container *ngIf="requestPaqueteState !== 'washing'; else washing">
          <div class="col s12 m6 l4" *ngFor="let prenda of propCurrentState?.prendas">
            <mat-card>
              <mat-card-content>
                <div class="row">

                  <!-- Scanned notification -->
                  <div class="col s3">
                    <span *ngIf="scanned(prenda) !== undefined"
                    matBadge="{{prenda | checkScanned:paqueteNextState.prendasReport:'check'}}"
                    [matBadgeColor]="prenda | checkScanned:paqueteNextState.prendasReport:'color'"
                    ></span>
                    <p *ngIf="prenda.producto">
                      <i class="{{prenda.producto | productIcon}} gfy-lg"></i>
                    </p>
                  </div>

                  <!-- Item Info -->
                  <div class="col s7">
                    <p style="margin-bottom: 0; font-size: small;"style="margin-bottom: 0;">{{prenda.producto}}</p>
                  </div>
                  <div class="col s2">
                    <p style="margin-bottom: 0; font-size: small;">
                      {{prenda.unidad}}/{{prenda.total}}
                    </p>
                  </div>

                </div>
              </mat-card-content> <!-- ITEM AREA ENDS-->
            </mat-card>
          </div>
        </ng-container>

        <ng-template #washing >
          <mat-accordion>
            <div class="col s12" *ngFor="let prenda of paqueteNextState.prendasReport">
              <mat-expansion-panel [disabled]="prenda.state != 'damage'">

                <mat-expansion-panel-header>
                  <!-- Scanned notification -->
                  <span class="scanned-notification"
                  *ngIf="scanned(prenda) !== undefined"
                  matBadge="{{prenda | checkScanned:paqueteNextState.prendasReport:'check'}}"
                  [matBadgeColor]="prenda | checkScanned:paqueteNextState.prendasReport:'color'"
                  ></span>

                  <!-- Prenda Info -->
                  <div class="row align-cols prenda-header">
                    <div class="col s9">
                      <p *ngIf="prenda.producto">
                        <i class="{{prenda.producto | productIcon}} gfy-lg"></i>
                      </p>
                    </div>
                    <div class="col s3">
                      <mat-chip-list>
                        <mat-chip [color]=" prenda.state != 'sucio' ? 'warn' : 'primary'"
                        selected>
                          {{prenda.state | prendaState}}
                        </mat-chip>
                      </mat-chip-list>
                    </div>
                  </div>
                </mat-expansion-panel-header>

                <!-- Report -->
                <ng-container class="col s12" *ngIf="prenda.state == 'damage'">
                  <ng-container *ngIf="prenda.event as event">
                    <p> <b>Reporte:</b>{{event.reporte}} </p>
                    <div class="row">
                      <div class="col s4 evidencia-img"
                      (click)="openImage(evidencia)"
                        *ngFor="let evidencia of event.evidences">
                          <img [src]="evidencia">
                      </div>
                    </div>

                  </ng-container>
                </ng-container>
              </mat-expansion-panel>

            </div>
          </mat-accordion>
        </ng-template>

      </div>
    </div> <!-- NOTIFY COL ENDS -->
  </div> <!-- CARD CONTAINER ENDS -->
</div> <!-- WORK AREA ENDS -->
