<mat-card>
  <mat-card-header *ngIf="title">
    <!-- <mat-card-title class="center" >
      <i class="fas fa-camera fa-2x"></i>
      <br>
      Escaner QR
    </mat-card-title> -->
    <mat-card-subtitle class="center">
      <ng-container *ngIf="scannerEnabled; else push">
      Enfoca el código para ser escanerado.
      </ng-container>
      <ng-template #push>
      Toca el recuadro para empezar a usar el escaner bluetooth.
      </ng-template>
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
      <ng-container *ngIf="scannerEnabled; else pause">
        <div class="scanner-box">
          <div id="scanner-container">
            <zxing-scanner
              #scanner
              (scanSuccess)="scanSuccessHandler($event)"
            >
            </zxing-scanner>
          </div>
          <div class="box-corner a"></div>
          <div class="box-corner b"></div>
          <div class="box-corner c"></div>
          <div class="box-corner d"></div>
        </div>

      </ng-container>
      <ng-template #pause>
        <form [formGroup]="codeForm" id="scanner-paused" cdkTrapFocus>
          <mat-form-field appearance="outline">
            <mat-label>Escaner bluetooth</mat-label>
            <input
            matInput
            type="text"
            name="propiedad"
            formControlName="propiedad"
            tabindex="1"
            >
            <input class="cdk-visually-hidden" type="text" tabindex="2" name="producto" formControlName="producto">
            <input class="cdk-visually-hidden" type="text" tabindex="3" name="paquete" formControlName="paquete">
            <input class="cdk-visually-hidden" type="text" tabindex="4" name="unidad" formControlName="unidad">
            <input class="cdk-visually-hidden" type="text" tabindex="5" name="total" formControlName="total">
            <input class="cdk-visually-hidden" type="text" tabindex="6" name="codigo" formControlName="codigo">
          </mat-form-field>
        </form>
      </ng-template>
  </mat-card-content>
  <p *ngIf="!scannerEnabled" class="center grey-text">O puedes usar la cámara de tu dispositivo</p>
  <mat-card-actions
  style="display: flex; justify-content: center;">
  <!-- input button -->
  <ng-container *ngIf="scannerEnabled; else input">
    <button mat-raised-button
    (click)="turnTobluetooth()"
    color="primary">
      <i class="fas fa-edit fa-lg"></i>
    </button>
  </ng-container>

  <!-- camera button -->
  <ng-template #input>
    <button mat-raised-button
    (click)="startScan()"
    color="primary">
      <i class="fas fa-camera fa-lg"></i>
    </button>
    </ng-template>
  </mat-card-actions>
</mat-card>
