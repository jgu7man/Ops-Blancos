<div class="container">
  <div class="row">
    <div class="col s12">
      <h2 class="center">{{historial.HistoryLabel}}</h2>
      <!-- <p class="center">  </p> -->
    </div>
  </div>


  <!-- BUSCADOR -->
  <div class="row">
    <div class="col s12">
      <mat-form-field appearance="outline" class="date-selector">
        <mat-label>Buscar por fecha</mat-label>
        <!-- Datepicker input -->
        <input matInput [matDatepicker]="picker"
        [formControl]="historial.dateCtrl"
        (dateChange)="historial.filterByDate( $event)" >
        <!-- Close button -->
        <button mat-icon-button matSuffix *ngIf="historial.filtering"
        color="accent" (click)="historial.clearFilter()"
        > <i class="fas fa-times"></i></button>
        <!-- Datepicker button -->
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </div>
  </div>


  <!-- LISTA DE DÍAS -->
  <ng-container *ngIf="!historial.filtering; else filtered">
    <ng-container *ngIf="historial.days.length > 0; else empty">
      <ng-container *ngFor="let day of historial.days; index as i">
        <g-historial-item [day]="day"></g-historial-item>
      </ng-container>
    </ng-container>

    <!-- NAVIGATOR BUTTON -->
    <div class="row" *ngIf="historial.query == 'day'">
      <div class="col s12 center">
        <button mat-raised-button color='primary'
        (click)="historial.getDayLess()" >Un día atrás</button>
      </div>
    </div>
  </ng-container>


  <!-- DÍA FILTRADO -->
  <ng-template #filtered >
    <ng-container *ngIf="historial.dayFiltered; else empty">
      <g-historial-item [day]="historial.dayFiltered"></g-historial-item>
    </ng-container>
  </ng-template>

  <!-- CONSULTA VACÍA -->
  <ng-template #empty >
    <div class="row">
      <div class="col s12 center">
        <p class="center">Nada que mostrar</p>
        <div class="img-background">
          <img src="/assets/img/sleeping.png" alt="sleeping">
        </div>
      </div>
    </div>
  </ng-template>






</div>
