<div class="container">
  <div class="row">
    <div class="col s12">
      <h3 class="center">Agregar personal</h3>
    </div>
  </div>
  <form [formGroup]="personalForm">
    <div class="row">
      <div class="col s12">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input
          matInput
          type="text"
          name="email"
          [formControl]="emailCtrl" />
          <mat-error *ngIf="emailCtrl.hasError('required')">
            El email es necesario
          </mat-error>
          <mat-error *ngIf="emailCtrl.hasError('email')">
            Agrega un formato de email válido
          </mat-error>
        </mat-form-field>
      </div>

      <div class="col s12">
        <mat-form-field appearance="outline">
          <mat-label>Nombre</mat-label>
          <input
          matInput
          type="text"
          name="name"
          [formControl]="nameCtrl"
          >
          <mat-error *ngIf="nameCtrl.hasError('required')">
          El nombre es necesario
          </mat-error>
        </mat-form-field>
      </div>

      <div class="col s12">
        <mat-form-field appearance="outline">
          <mat-label>Celular</mat-label>
          <input
          matInput
          type="text"
          name="celular"
          [formControl]="celCtrl"
          >
          <mat-error *ngIf="celCtrl.hasError('required')">
          Este dato es necesario
          </mat-error>
        </mat-form-field>
      </div>

      <div class="col s12">
        <mat-form-field appearance="outline">
          <mat-select placeholder="Elige un rol" [formControl]="rolCtrl" name="rol">
            <mat-option *ngFor="let rol of personal_.Roles" [value]="rol.value">
              {{rol.display}}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="rolCtrl.hasError('required')">
            Este dato es necesario
          </mat-error>
        </mat-form-field>
      </div>
    </div>
  </form>
</div>
