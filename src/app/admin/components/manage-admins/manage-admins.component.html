<div class="container">
  <div class="row">
    <div class="col s12">
      <gdev-list-crud
      listName="Personal"
      [selectTemplate]="select"
      [addTemplate]="add"
      [selectTemplate]="select"
      [height_vh]="100"
      (onAdd)="sendCreateMail()"
      (onSave)="updateUser()"
      [List]="personal"
      itemSelector="full_name"
      >
          <ng-template #select let-user="item" >
            <g-show-admin [user]="user"></g-show-admin>
          </ng-template>

          <ng-template #add>
            <g-add-personal></g-add-personal>
          </ng-template>

      </gdev-list-crud>

    </div>
  </div>
</div>
