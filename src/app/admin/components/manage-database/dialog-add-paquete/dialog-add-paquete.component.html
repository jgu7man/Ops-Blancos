<mat-dialog-content>
  <div class="row">
    <div class="col s12">
      <mat-form-field>
        <mat-label>Número de paquete</mat-label>
        <input
        matInput
        type="number"
        [(ngModel)]="paqueteNumber"
        name="index"
        required
        >
      </mat-form-field>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions
style="display: flex; justify-content: space-around;">
    <button mat-raised-button
    (click)="dialog_.close()"
    >Cancelar</button>
    <button mat-raised-button
    color="primary"
    (click)="dialog_.close(paqueteNumber)"
    >Agregar</button>
</mat-dialog-actions>
