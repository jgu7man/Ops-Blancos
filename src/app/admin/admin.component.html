<g-topbar [menuRoutes]="routes"></g-topbar>

<mat-drawer-container>
  <!-- ADMIN SIDEBAR -->
  <mat-drawer [opened]="responsive.large" mode="side" id="admin-sidebar" mxStretchHeight>
    <a class="side navbtn" [routerLink]="['dashboard']" [routerLinkActive]="'active'">
      <i class="fas fa-tachometer-alt fa-lg  white-text"></i> Panel
    </a>
    <mat-divider [inset]="true"></mat-divider>
    <a class="side navbtn" [routerLink]="['propiedades']" [routerLinkActive]="'active'">
      <i class="fas fa-home fa-lg  white-text"></i> Propiedades
    </a>
    <mat-divider [inset]="true"></mat-divider>
    <a class="side navbtn" [routerLink]="['/admin/manage-admins']"  [routerLinkActive]="'active'">
      <i class="fas fa-users fa-lg  white-text"></i> Personal
    </a>
    <mat-divider [inset]="true"></mat-divider>
    <a class="side navbtn" [routerLink]="['manage-database']" [routerLinkActive]="'active'">
      <i class="fas fa-server fa-lg  white-text"></i> Base de datos
    </a>
    <mat-divider [inset]="true"></mat-divider>
  </mat-drawer>

  <!-- ADMIN DASHBOARD -->
  <mat-drawer-content>
    <div class="page-container">
      <div class="row">
        <div class="col s12">
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>
  </mat-drawer-content>
</mat-drawer-container>

<!-- MOBILE BOTTOM BAR -->
<ng-container *ngIf="!responsive.large;">
  <mat-toolbar color="accent" class="mat-elevation-z4" id="bottom-bar">
    <span class="navbtn">
      <i class="fas fa-tachometer-alt fa-lg  white-text" [routerLink]="['dashboard']" [routerLinkActive]="'active'"></i>
    </span>
    <span class="navbtn">
      <i class="fas fa-home fa-lg  white-text" [routerLink]="['propiedades']" [routerLinkActive]="'active'"></i>
    </span>
    <span class="navbtn">
      <i class="fas fa-users fa-lg  white-text" [routerLink]="['/admin/manage-admins']"  [routerLinkActive]="'active'"></i>
    </span>
    <span class="navbtn">
      <i class="fas fa-server fa-lg  white-text" [routerLink]="['manage-database']" [routerLinkActive]="'active'"></i>
    </span>
  </mat-toolbar>
</ng-container>
